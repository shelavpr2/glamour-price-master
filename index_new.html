<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glamour NY">
<meta name="description" content="Glamour New York Customer Price Master">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Glamour NY · Price Master</title>
<style>
:root{
  --gold:#c9a96e;--gold2:#a8813d;--dark:#0f0f1a;--dark2:#1a1a2e;--dark3:#12122a;
  --border:#2a2a45;--text:#e8e8f0;--muted:#888;--muted2:#555;
  --green:#5dcc88;--blue:#6ab0ff;--red:#ff9090;--purple:#ce93d8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--dark)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text);overscroll-behavior:none}

.app-header{
  background:var(--dark2);border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top,0) 16px 0;
  padding-top:calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom:12px;
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:12px
}
.logo-svg{width:34px;height:34px;flex-shrink:0}
.app-title h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.2px}
.app-title p{font-size:11px;color:var(--muted);margin-top:1px}
.badge{background:var(--border);color:var(--gold);font-size:10px;font-weight:700;
  padding:3px 9px;border-radius:20px;letter-spacing:.5px;margin-left:auto}

.section{padding:14px 16px 0}

.sel-label{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--gold);
  text-transform:uppercase;margin-bottom:8px}
.combo{position:relative}
select{
  width:100%;padding:13px 40px 13px 14px;
  background:var(--dark3);border:2px solid var(--gold);border-radius:10px;
  color:#fff;font-size:14px;font-weight:600;font-family:inherit;
  cursor:pointer;appearance:none;-webkit-appearance:none;outline:none
}
select:focus{border-color:#d4b87a;box-shadow:0 0 0 3px rgba(201,169,110,.15)}
.combo-arr{position:absolute;right:13px;top:50%;transform:translateY(-50%);
  color:var(--gold);pointer-events:none;font-size:13px}

.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
.mc{background:var(--dark2);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.mc.wide{grid-column:1/-1}
.mc-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.mc-val{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-val.big{font-size:17px;color:var(--gold)}
.mc-val.mid{font-size:15px;color:var(--gold)}

.stats{display:flex;margin:10px 16px 0;background:var(--dark2);
  border:1px solid var(--border);border-radius:10px;overflow:hidden}
.st{flex:1;padding:10px 4px;text-align:center;border-right:1px solid var(--border)}
.st:last-child{border-right:none}
.st-val{font-size:13px;font-weight:700;color:var(--gold)}
.st-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.tbl-section{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 80px)}
.tbl-wrap{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:480px}
thead th{
  background:#1c1c35;color:var(--muted);padding:9px 10px;
  text-align:center;font-size:10px;font-weight:700;letter-spacing:.8px;
  border-bottom:1px solid var(--border);white-space:nowrap
}
th.p{text-align:left;padding-left:14px;color:var(--muted)}
th.mn{color:var(--green)}
th.av{color:var(--blue)}
th.la{color:var(--red)}
th.sh{color:var(--purple)}
tbody tr{border-bottom:1px solid #1a1a30}
tbody tr:last-child{border-bottom:none}
tbody tr:active{background:#1e1e38}
td{padding:10px 10px;text-align:center;color:var(--text);white-space:nowrap}
td.p{text-align:left;padding-left:14px;white-space:normal;max-width:150px;
  word-break:break-word;line-height:1.3;color:#ddd;font-weight:500}
td.mn{color:var(--green);font-weight:600}
td.av{color:var(--blue)}
td.la{color:var(--red);font-weight:700;font-size:13px}
td.sh{color:var(--purple)}
td.qt{color:#fff;font-weight:700}
td.dt{color:var(--muted);font-size:11px}
td.iv{color:var(--muted2);font-size:11px}
.tr-tot td{background:#1c1c35;font-weight:700;border-top:1px solid var(--gold)!important}
.tr-tot .qt,.tr-tot .sh{color:var(--gold);font-size:14px}

.fab-row{
  position:fixed;bottom:0;left:0;right:0;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);
  background:linear-gradient(to top, var(--dark) 70%, transparent);
  display:flex;gap:10px
}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:14px;border-radius:10px;border:none;cursor:pointer;
  font-size:13px;font-weight:700;font-family:inherit;transition:all .15s}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1000}
.btn-gold:active{transform:scale(.97)}
.btn-out{background:var(--dark2);border:1px solid var(--border);color:var(--muted)}
.btn-out:active{background:var(--border)}

.install-bar{
  margin:10px 16px 0;background:var(--dark2);border:1px solid var(--gold);
  border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px
}
.install-bar p{flex:1;font-size:12px;color:var(--muted);line-height:1.4}
.install-bar strong{color:var(--gold);display:block;margin-bottom:1px;font-size:13px}
.install-bar button{background:var(--gold);color:#1a1000;border:none;border-radius:7px;
  padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="app-header">
  <svg class="logo-svg" viewBox="0 0 34 34" fill="none">
    <circle cx="17" cy="17" r="16" stroke="#c9a96e" stroke-width="1.5"/>
    <circle cx="17" cy="17" r="12" stroke="#c9a96e" stroke-width=".5" stroke-dasharray="2 3"/>
    <text x="17" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#c9a96e" font-family="Georgia,serif">G</text>
  </svg>
  <div class="app-title">
    <h1>Glamour New York</h1>
    <p>Customer Price Master</p>
  </div>
  <div class="badge" id="countBadge">55 clients</div>
</div>

<div class="install-bar hidden" id="installBar">
  <p><strong>Add to home screen</strong>Works offline, opens like a native app</p>
  <button onclick="doInstall()">Install</button>
</div>

<div class="section">
  <div class="sel-label">Customer</div>
  <div class="combo">
    <select id="sel" onchange="load(this.value)"></select>
    <span class="combo-arr">▾</span>
  </div>
</div>

<div class="meta-grid hidden" id="metaGrid">
  <div class="mc wide"><div class="mc-lbl">Contact name</div><div class="mc-val big" id="mName"></div></div>
  <div class="mc wide"><div class="mc-lbl">Company</div><div class="mc-val" id="mCo" style="font-size:14px"></div></div>
  <div class="mc"><div class="mc-lbl">Invoices</div><div class="mc-val big" id="mInv"></div></div>
  <div class="mc"><div class="mc-lbl">Products</div><div class="mc-val big" id="mProds"></div></div>
  <div class="mc"><div class="mc-lbl">Total revenue</div><div class="mc-val mid" id="mRev"></div></div>
  <div class="mc"><div class="mc-lbl">Total shipping</div><div class="mc-val mid" id="mShip"></div></div>
</div>

<div class="stats hidden" id="statsBar">
  <div class="st"><div class="st-val" id="sFirst"></div><div class="st-lbl">First order</div></div>
  <div class="st"><div class="st-val" id="sLast"></div><div class="st-lbl">Last order</div></div>
  <div class="st"><div class="st-val" id="sAvgO"></div><div class="st-lbl">Avg order $</div></div>
</div>

<div class="tbl-section hidden" id="tblSection">
  <div class="tbl-wrap">
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr>
            <th class="p"># &nbsp;Product</th>
            <th class="mn">Min $</th>
            <th class="av">Avg $</th>
            <th class="la">Last $</th>
            <th>Date</th>
            <th>Inv</th>
            <th>Qty</th>
            <th class="sh">Ship $</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="fab-row hidden" id="fabRow">
  <button class="btn btn-gold" onclick="exportXLS()">⬇ Export Excel</button>
  <button class="btn btn-out" onclick="exportAll()">All clients</button>
</div>

// Build data map
const cm={};
for(const[inv,dt,ck,pr,price,qty,ship] of IV){
  if(price<=0)continue;
  if(!cm[ck])cm[ck]={p:{},invs:new Set()};
  if(!cm[ck].p[pr])cm[ck].p[pr]=[];
  cm[ck].p[pr].push({dt,price,qty,ship,inv});
  cm[ck].invs.add(inv);
}

function pd(d){const[m,dy,y]=d.split('/');return new Date(y,m-1,dy);}
function agg(es){
  const pr=es.map(e=>e.price),qt=es.map(e=>e.qty),sh=es.map(e=>e.ship),dt=es.map(e=>pd(e.dt));
  const tQ=qt.reduce((a,b)=>a+b,0);
  const minP=Math.min(...pr);
  const avgP=pr.reduce((s,p,i)=>s+p*qt[i],0)/tQ;
  const li=dt.reduce((bi,d,i)=>d>dt[bi]?i:bi,0);
  return{minP,avgP:+avgP.toFixed(2),lastP:pr[li],lastD:es[li].dt,lastInv:es[li].inv,tQ,tS:+sh.reduce((a,b)=>a+b,0).toFixed(2)};
}

const $=id=>document.getElementById(id);
const keys=Object.keys(cm).sort((a,b)=>(CU[a]||[a])[0].localeCompare((CU[b]||[b])[0]));
const sel=$('sel');
for(const k of keys){
  const[c,co]=CU[k]||[k,''];
  const o=document.createElement('option');
  o.value=k; o.textContent=co?`${c}  |  ${co}`:c;
  sel.appendChild(o);
}
$('countBadge').textContent=keys.length+' clients';

function f$(n){return n>0?'$'+n.toFixed(2):'—';}
function fdate(d){return new Date(Math.min(...d)).toLocaleDateString('en-US',{month:'short',year:'2-digit'});}

function load(k){
  if(!k){['metaGrid','statsBar','tblSection','fabRow'].forEach(id=>$(id).classList.add('hidden'));return;}
  const c=cm[k];
  const[ct,co]=CU[k]||[k,''];
  const ae=Object.values(c.p).flat();
  const ds=ae.map(e=>pd(e.dt));
  const rev=ae.reduce((s,e)=>s+e.price*e.qty,0);
  const shp=ae.reduce((s,e)=>s+e.ship,0);
  const nInv=c.invs.size;

  $('mName').textContent=ct;
  $('mCo').textContent=co||'—';
  $('mInv').textContent=nInv;
  $('mProds').textContent=Object.keys(c.p).length;
  $('mRev').textContent='$'+rev.toFixed(2);
  $('mShip').textContent='$'+shp.toFixed(2);
  $('sFirst').textContent=new Date(Math.min(...ds)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});
  $('sLast').textContent=new Date(Math.max(...ds)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});
  $('sAvgO').textContent='$'+(rev/nInv).toFixed(0);

  ['metaGrid','statsBar','tblSection','fabRow'].forEach(id=>$(id).classList.remove('hidden'));

  const tb=$('tbody'); tb.innerHTML='';
  let tQ=0,tS=0;
  Object.keys(c.p).sort().forEach((pr,i)=>{
    const a=agg(c.p[pr]); tQ+=a.tQ; tS+=a.tS;
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="p"><span style="color:var(--muted2);font-size:10px;margin-right:5px">${i+1}</span>${pr}</td><td class="mn">${f$(a.minP)}</td><td class="av">${f$(a.avgP)}</td><td class="la">${f$(a.lastP)}</td><td class="dt">${a.lastD}</td><td class="iv">${a.lastInv}</td><td class="qt">${a.tQ.toLocaleString()}</td><td class="sh">${f$(a.tS)}</td>`;
    tb.appendChild(tr);
  });
  const tr=document.createElement('tr'); tr.className='tr-tot';
  tr.innerHTML=`<td class="p" style="text-align:right;color:var(--muted);font-size:11px">totals</td><td></td><td></td><td></td><td></td><td></td><td class="qt">${tQ.toLocaleString()}</td><td class="sh">${f$(tS)}</td>`;
  tb.appendChild(tr);
}

function exportXLS(){
  const k=sel.value; if(!k)return;
  const c=cm[k];
  const[ct,co]=CU[k]||[k,''];
  const wb=XLSX.utils.book_new();
  const rows=[["GLAMOUR NEW YORK — PRICE LIST"],["Contact: "+ct],["Company: "+(co||"—")],["Exported: "+new Date().toLocaleDateString()],[],
    ["#","Product","Min $","Avg $","Last $","Last Date","Inv #","Total Qty","Shipping $"]];
  Object.keys(c.p).sort().forEach((pr,i)=>{
    const a=agg(c.p[pr]);
    rows.push([i+1,pr,a.minP,a.avgP,a.lastP,a.lastD,a.lastInv,a.tQ,a.tS]);
  });
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:4},{wch:36},{wch:11},{wch:11},{wch:11},{wch:12},{wch:10},{wch:10},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'Price List');
  const safe=(co||ct).replace(/[^a-z0-9]/gi,'_');
  XLSX.writeFile(wb,'Pricelist_'+safe+'.xlsx');
}

function exportAll(){
  const wb=XLSX.utils.book_new();
  for(const k of keys){
    const c=cm[k];const[ct,co]=CU[k]||[k,''];
    const rows=[["#","Contact","Company","Product","Min $","Avg $","Last $","Last Date","Inv #","Total Qty","Shipping $"]];
    Object.keys(c.p).sort().forEach((pr,i)=>{
      const a=agg(c.p[pr]);
      rows.push([i+1,ct,co,pr,a.minP,a.avgP,a.lastP,a.lastD,a.lastInv,a.tQ,a.tS]);
    });
    const sn=ct.substring(0,28).replace(/[\/\\*?\[\]:']/g,'-');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),sn);
  }
  XLSX.writeFile(wb,'Glamour_All_Pricelists.xlsx');
}

if(keys.length){sel.value=keys[0];load(keys[0]);}
